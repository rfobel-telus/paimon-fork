name: Publish HDS Release to GitHub Packages

on:
  push:
    branches:
      - 'hds/**'
  workflow_dispatch:
    inputs:
      hds_version_suffix:
        description: 'HDS version suffix (e.g. hds.2 → publishes 1.4.1-hds.2)'
        required: false
        default: 'hds.2'

env:
  JDK_VERSION: 11
  MAVEN_OPTS: >-
    -Xmx4096m
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=30
    -Dmaven.wagon.http.retryHandler.requestSentEnabled=true

jobs:
  publish-hds:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: 'temurin'
          # Configure GitHub Packages as a Maven server
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: hds-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: hds-maven-

      - name: Compute HDS version
        id: ver
        run: |
          BASE=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SUFFIX="${{ github.event.inputs.hds_version_suffix || 'hds.2' }}"
          HDS_VERSION="${BASE}-${SUFFIX}"
          echo "hds_version=${HDS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${HDS_VERSION}"

      - name: Set project version
        run: |
          mvn --batch-mode versions:set \
            -DnewVersion="${{ steps.ver.outputs.hds_version }}" \
            -DgenerateBackupPoms=false

      - name: Install all selected modules and their deps (no deploy)
        run: |
          # Use --also-make to install paimon-parent + all transitive intra-project
          # deps (e.g. paimon-test-utils) into the local Maven repo. Running 'install'
          # (not 'deploy') means nothing is uploaded to GitHub Packages here.
          PROJECTS="paimon-api,paimon-common,paimon-format,paimon-codegen,paimon-core,paimon-flink/paimon-flink-common,paimon-flink/paimon-flink-2.1,paimon-flink/paimon-flink-cdc"
          mvn --batch-mode install \
            -Pflink2 \
            -DskipTests \
            -Dcheckstyle.skip=true \
            -Dlicense.skip=true \
            -Drat.skip=true \
            -Dspotless.check.skip=true \
            -Denforcer.skip=true \
            -Dmaven.javadoc.skip=true \
            -Dmaven.source.skip=true \
            --also-make \
            --projects "$PROJECTS"

      - name: Deploy selected modules to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # All deps (paimon-parent, paimon-test-utils, etc.) are already in the
          # local Maven repo from the install step above. Run deploy without
          # --also-make so the root POM is never in scope for the deploy phase.
          PROJECTS="paimon-api,paimon-common,paimon-format,paimon-codegen,paimon-core,paimon-flink/paimon-flink-common,paimon-flink/paimon-flink-2.1,paimon-flink/paimon-flink-cdc"
          mvn --batch-mode deploy \
            -Pflink2 \
            -DskipTests \
            -Dcheckstyle.skip=true \
            -Dlicense.skip=true \
            -Drat.skip=true \
            -Dspotless.check.skip=true \
            -Dmaven.javadoc.skip=true \
            -Dmaven.source.skip=true \
            --projects "$PROJECTS" \
            -DaltDeploymentRepository="github::default::https://maven.pkg.github.com/${{ github.repository }}"
